<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Рабочий таймер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0a0c;--s1:#131316;--s2:#1c1c21;--line:rgba(255,255,255,.07);--tx:#f3f3f5;--mut:#8a8a94;--dim:#4d4d56;--acc:#4a8cff;--acc-tx:#ffffff;--red:#ff5d5d;--amb:#ffb648;--mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace}
html{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,textarea,select{font-size:16px!important}
body{margin:0;position:fixed;inset:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
:root{--top:0px;--bot:max(env(safe-area-inset-bottom),var(--tgb,0px))}
#app{position:absolute;top:var(--top);left:0;right:0;bottom:calc(64px + var(--bot));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px}
h2{margin:22px 0 10px;font-size:26px;font-weight:700;letter-spacing:-.02em}
h3{margin:0 0 10px;font-size:15px;font-weight:600}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.center{text-align:center}
.hint{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0}
.line+.line{border-top:1px solid var(--line)}
.line>span:last-child{white-space:nowrap}
select{width:100%;padding:12px 14px;border-radius:12px;border:0;background:var(--s2);color:var(--tx);font:inherit;margin:4px 0 8px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:var(--s2);color:var(--tx);font:inherit;margin:4px 0 8px}
input:focus,textarea:focus{outline:none;border-color:rgba(74,140,255,.5)}
input::placeholder{color:var(--dim)}
textarea{font:12px/1.5 var(--mono);min-height:260px;color:var(--mut)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--acc);color:var(--acc-tx);font:inherit;font-weight:600;margin:4px 0}
.btn:active,.item:active,.go:active{transform:scale(.98)}
.btn.alt{background:var(--s2);color:var(--tx)}
.btn.ok{background:var(--acc);color:var(--acc-tx)}
.btn.warn{background:transparent;color:var(--amb);border:1px solid rgba(255,182,72,.4)}
.btn.del,.btn.end{background:transparent;color:var(--red);border:1px solid rgba(255,93,93,.3)}
.btn.sm{width:auto;padding:12px 16px;margin:4px 0 8px}
.two{display:flex;gap:8px}.two .btn{flex:1}
.inl{display:flex;gap:8px;align-items:center}
.inl input{flex:1;min-width:0}
.hero{min-height:100%;display:flex;flex-direction:column;padding-bottom:14px}
.hero-top{padding:18px 60px 0 2px}
.greet{font-size:clamp(24px,3.8vh,30px);font-weight:700;letter-spacing:-.02em;margin-top:6px}
.hero-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,4.5vh,48px) 0 clamp(18px,4.5vh,44px)}
.go{position:relative;display:grid;place-items:center;width:clamp(160px,28vh,220px);height:clamp(160px,28vh,220px);border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#8db8ff,var(--acc) 60%);color:var(--acc-tx);font:inherit;font-size:26px;font-weight:700;letter-spacing:-.01em;box-shadow:0 0 0 12px rgba(74,140,255,.06),0 28px 80px rgba(74,140,255,.2);transition:transform .15s}
.go::before,.go::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(74,140,255,.35);animation:ripple 3.6s ease-out infinite;pointer-events:none}
.go::after{animation-delay:1.8s}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.32);opacity:0}}
.go-cap{margin-top:clamp(24px,5vh,46px);text-align:center}
.trio{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border:1px solid var(--line);border-radius:20px}
.trio>div{padding:16px 6px 14px;text-align:center}
.trio>div+div{border-left:1px solid var(--line)}
.trio .v{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:2px}
.link{display:block;margin:16px auto 0;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;padding:10px 14px}
@media (prefers-reduced-motion:reduce){.go::before,.go::after{animation:none}}
.clock{font-family:var(--mono);font-size:46px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.ringwrap{position:relative;width:256px;height:256px;margin:22px auto 8px}
.ringwrap svg{display:block}
.ringwrap .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;flex:none}
.dot.live{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:var(--s2);color:var(--tx);font:inherit;padding:13px 14px;border-radius:14px;margin:6px 0}
.pcard{display:block;width:100%;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--s2);color:var(--mut);font-weight:500;vertical-align:middle}
.badge.wait{background:rgba(255,182,72,.12);color:var(--amb);white-space:nowrap}
.badge.done{background:rgba(74,140,255,.12);color:var(--acc)}
.big{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.grid .card{margin:0}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;margin:16px 0 10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;padding:8px;border-radius:10px}
.seg button.on{background:var(--s2);color:var(--tx)}
.per{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.per b{font-weight:600;text-transform:capitalize}
.per button{border:1px solid var(--line);background:var(--s1);color:var(--tx);font:inherit;font-size:18px;width:42px;height:38px;border-radius:12px}
.task{padding:12px 0}
.task+.task{border-top:1px solid var(--line)}
.task.d .tn{text-decoration:line-through;color:var(--mut)}
.ib{border:0;background:var(--s2);color:var(--tx);font:inherit;border-radius:10px;padding:7px 11px;margin-left:4px}
.ib.play{background:var(--acc);color:var(--acc-tx)}
.pen{border:0;background:none;color:var(--dim);font-size:14px;padding:2px 6px}
details summary{color:var(--mut);font-size:13px;cursor:pointer;margin-top:6px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+ '}
details[open] summary::before{content:'− '}
details.sw{margin:4px 0 8px}
details.sw summary{text-align:center;padding:8px}
.ftabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px}
.ftabs::-webkit-scrollbar,.pager::-webkit-scrollbar{display:none}
.ftab{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mut);font:inherit;font-size:14px;padding:8px 14px;border-radius:20px;white-space:nowrap}
.ftab span{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:6px}
.ftab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.ftab.on span{color:var(--bg);opacity:.55}
.pager{overflow:hidden;margin:0 -16px;touch-action:pan-y;transition:height .3s ease}
.track{display:flex;align-items:flex-start;transition:transform .34s cubic-bezier(.22,.8,.24,1);will-change:transform}
.page{flex:0 0 100%;min-width:0;padding:0 16px}
.gear{position:absolute;top:18px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--s1);color:var(--mut);display:grid;place-items:center;padding:0;z-index:5}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear:active{transform:scale(.94)}
.tgl{position:relative;width:48px;height:28px;flex:none}
.tgl input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;z-index:1}
.tgl i{position:absolute;inset:0;background:var(--s2);border-radius:14px;transition:background .2s}
.tgl i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:left .2s,background .2s}
.tgl input:checked+i{background:var(--acc)}
.tgl input:checked+i::after{left:23px;background:var(--acc-tx)}
.errbar{position:fixed;left:12px;right:12px;top:calc(10px + var(--top) + env(safe-area-inset-top));z-index:50;background:#3a1416;color:#ffb3b3;border:1px solid rgba(255,93,93,.4);border-radius:14px;padding:12px 14px;font-size:13px}
.mback{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + var(--bot));opacity:0;transition:opacity .18s}
.mback.on{opacity:1}
.modal{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:20px 16px 12px;transform:translateY(20px);transition:transform .2s}
.mback.on .modal{transform:none}
.mmsg{white-space:pre-line;font-size:16px;line-height:1.45;margin:0 4px 16px}
.mbtns{display:flex;gap:8px}.mbtns .btn{flex:1;margin:0}
.btn.danger{background:var(--red);color:#fff}
.tf{display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:12px;padding:0 0 0 12px;margin:4px 0 8px;border:1px solid transparent}
.tf:focus-within{border-color:rgba(74,140,255,.5)}
.tf span{color:var(--mut);white-space:nowrap;font-size:15px}
.tf input{margin:0;border:0;background:none;padding-left:4px}
.tf input:focus{border:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:2px;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--s2);color:var(--mut);white-space:nowrap}
.cpk{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.cpk button{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 2px var(--s1)}
.cpk button.on{box-shadow:0 0 0 2px var(--s1),0 0 0 4px var(--tx)}
details.cdet summary{display:flex;justify-content:space-between;align-items:center;margin:0;color:inherit}
details.cdet summary::before{content:none}
details.cdet summary::after{content:'›';color:var(--dim);font-size:20px;line-height:1;transition:transform .2s}
details.cdet[open] summary::after{transform:rotate(90deg)}
details.cdet summary .dot{margin:0 10px 0 auto}
.trow{position:relative;margin:6px 0;border-radius:14px;overflow:hidden;touch-action:pan-y}
.tsw{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;font-size:14px;opacity:0;background:var(--s2);border-radius:14px}
.trow.sw-on .tsw{opacity:1}.tsw .l{color:var(--acc)}.tsw .r{color:var(--amb)}
.tfg{position:relative;display:flex;align-items:center;gap:10px;padding:11px 10px 11px 12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;transition:transform .22s ease}
.trow.ed .tsw{display:none}
.trow.ed .tfg{border-radius:14px 14px 0 0;border-bottom:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);background:none;flex:none;padding:0;color:#fff;font-size:13px;line-height:20px}
.chk.on{background:var(--acc);border-color:var(--acc)}
.tmain{flex:1;min-width:0;cursor:pointer}.ttl{word-break:break-word}.trow.dn .ttl{color:var(--mut);text-decoration:line-through}
.tmeta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.due{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--s2);color:var(--mut);white-space:nowrap;vertical-align:1px}
.due.over{background:rgba(255,93,93,.14);color:var(--red)}.due.today{background:rgba(74,140,255,.16);color:var(--acc)}
.star{border:0;background:none;color:var(--dim);font-size:19px;padding:4px 2px;line-height:1}.star.on{color:var(--amb)}
.ted{position:relative;background:var(--s1);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:4px 12px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--s2);color:var(--tx);font:inherit;font-size:13px;padding:7px 11px;border-radius:10px}
.chips button.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.tgrp{margin:18px 0 2px 4px;display:flex;justify-content:space-between}
.cdot{width:18px;height:18px;border-radius:50%;border:0;padding:0;vertical-align:-3px;margin-right:8px}
.tag button{border:0;background:none;color:inherit;opacity:.7;font-size:11px;padding:0 0 0 4px}
.lg{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.acbox{position:fixed;z-index:70;background:#1a1a20;border:1px solid var(--line);border-radius:12px;max-height:220px;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:4px}
.aci{padding:11px 12px;border-radius:9px;cursor:pointer}
.aci b{color:var(--acc);font-weight:600}
.aci.on,.aci:hover{background:var(--s2)}
.x{border:0;background:none;color:var(--dim);font-size:16px;padding:4px 8px}
a.back{color:var(--mut);text-decoration:none;display:inline-block;margin-top:16px;font-size:14px}
.top{color:var(--acc)}.low{color:var(--red)}
.hbar{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:8px}
.hbar i{display:block;height:100%;border-radius:3px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:12px 0 10px;background:var(--s2)}
.tl{position:relative;height:12px;background:var(--s2);border-radius:4px;overflow:hidden;margin:12px 0 6px}
.tl i{position:absolute;top:0;bottom:0}
.cols{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:14px}
.cols .c{flex:1;position:relative;height:100%}
.cols .c b,.cols .c i{position:absolute;bottom:0;left:0;right:0;border-radius:3px 3px 1px 1px}
.cols .c b{background:#5c5c6e}
.cols .c i{background:var(--acc)}
.axis{display:flex;gap:3px;margin-top:6px}
.axis span{flex:1;text-align:center;font-size:10px;color:var(--dim);font-family:var(--mono);overflow:visible;white-space:nowrap}
.leg{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mut)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(64px + var(--bot));align-items:flex-start;display:flex;background:rgba(10,10,12,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--bot));z-index:10}
nav button{flex:1;border:0;background:none;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.04em;padding:4px 0}
nav svg{display:block;margin:0 auto 4px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
</style>
</head>
<body>
<div id="app"><p class="hint" style="margin-top:30px">Загрузка…</p></div>
<nav>
  <button id="n-home" onclick="tab='home';cur=null;ren=null;settings=false;endAsk=false;resetAsk=false;render()"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg>Работа</button>
  <button id="n-todo" onclick="tab='todo';cur=null;ren=null;settings=false;endAsk=false;resetAsk=false;tEdit=null;render()"><svg viewBox="0 0 24 24"><path d="M4 6.5l1.8 1.8L9 5M4 12.5l1.8 1.8L9 11M4 18.5l1.8 1.8L9 17M12.5 7h7.5M12.5 13h7.5M12.5 19h7.5"/></svg>Задачи</button>
  <button id="n-proj" onclick="tab='proj';cur=null;ren=null;settings=false;endAsk=false;resetAsk=false;render()"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>Проекты</button>
  <button id="n-stat" onclick="tab='stat';cur=null;ren=null;settings=false;endAsk=false;resetAsk=false;render()"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>Статистика</button>
</nav>
<script>
// ▼▼▼ АДРЕС СЕРВЕРА ДЛЯ ОТПРАВКИ КОПИЙ В ЧАТ (Cloudflare Worker). Оставь пустым '', чтобы отключить. ▼▼▼
const BACKUP_URL = 'https://worksessiontimer.irodovartem.workers.dev/';
// ▲▲▲
const tg = window.Telegram && Telegram.WebApp;
const V = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
if (tg) { tg.ready(); tg.expand(); try { if (V('7.7')) tg.disableVerticalSwipes(); } catch {} }
const mobile = !!(tg && /^(ios|android|android_x)$/.test(tg.platform || ''));
const canFull = !!(mobile && V('8.0') && tg.requestFullscreen);
function applyInsets() {
  const sa = (tg && tg.safeAreaInset) || {}, ca = (tg && tg.contentSafeAreaInset) || {}, full = !!(tg && tg.isFullscreen);
  document.documentElement.style.setProperty('--top', (full ? (sa.top || 0) + (ca.top || 0) : 0) + 'px');
  document.documentElement.style.setProperty('--tgb', ((sa.bottom || 0) + (ca.bottom || 0)) + 'px');
}
if (tg && V('8.0')) { ['fullscreenChanged', 'safeAreaChanged', 'contentSafeAreaChanged', 'viewportChanged'].forEach(ev => { try { tg.onEvent(ev, applyInsets); } catch {} }); applyInsets(); }
function setFull(on) {
  if (!canFull) return;
  try { if (on && !tg.isFullscreen) tg.requestFullscreen(); if (!on && tg.isFullscreen) tg.exitFullscreen(); } catch {}
  setTimeout(applyInsets, 300);
}
const cloud = !!(tg && tg.initData && tg.CloudStorage && V('6.9'));
const LS = 'st-';

/* ===== Хранилище: Telegram CloudStorage (синхронизируется между устройствами) или localStorage в обычном браузере ===== */
const store = {
  async keys() {
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.getKeys((e, k) => e ? no(e) : ok(k || [])));
    return Object.keys(localStorage).filter(k => k.startsWith(LS)).map(k => k.slice(LS.length));
  },
  async get(keys) {
    const out = {};
    for (let i = 0; i < keys.length; i += 40) {
      const part = keys.slice(i, i + 40);
      if (cloud) await new Promise((ok, no) => tg.CloudStorage.getItems(part, (e, v) => e ? no(e) : (Object.assign(out, v || {}), ok())));
      else part.forEach(k => { const v = localStorage.getItem(LS + k); if (v != null) out[k] = v; });
    }
    return out;
  },
  async set(k, v) {
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.setItem(k, v, e => e ? no(e) : ok()));
    localStorage.setItem(LS + k, v);
  },
  async del(keys) {
    if (!keys.length) return;
    if (cloud) return new Promise((ok, no) => tg.CloudStorage.removeItems(keys, e => e ? no(e) : ok()));
    keys.forEach(k => localStorage.removeItem(LS + k));
  }
};

/* ===== Утилиты ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Math.floor(Date.now() / 1000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    const n = D.byRate.length, mx = D.byRate[0].rt;
    h += `<div class="card"><div class="lbl" style="margin-bottom:4px">Ставка закрытых проектов</div>` + D.byRate.map((x, i) =>
      `<div style="padding:9px 0"><div class="row"><span>${esc(x.p.n)}${n > 1 && i === 0 ? ' <span class="badge done">дороже всего</span>' : n > 1 && i === n - 1 ? ' <span class="badge" style="color:var(--red)">дешевле всего</span>' : ''}</span><span class="num">${money(x.rt)}/ч</span></div>
       <div class="hbar"><i style="width:${x.rt / mx * 100}%;background:${colorOf(x.p.id)}"></i></div></div>`).join('') + '</div>';
  }
  const per = PER[sMode][1];
  h += BACKUP_URL
    ? `<button class="btn" style="margin-top:4px" onclick="sendReport()" ${repSending ? 'disabled style="opacity:.6;margin-top:4px"' : ''}>${repSending ? 'Отправляю…' : '📩 Отчёт за ' + per + ' в чат'}</button><button class="btn alt" onclick="makeReport()">Скопировать отчёт текстом</button>`
    : `<button class="btn" style="margin-top:4px" onclick="makeReport()">Выгрузить отчёт за ${per}</button>`;
  if (report) h += `<div class="card" id="repc"><div class="row" style="margin-bottom:6px"><span class="lbl">Отчёт · скопирован</span><button class="x" onclick="report=null;render()" aria-label="Закрыть отчёт">✕</button></div>
    <textarea id="rep" readonly>${esc(report)}</textarea>
    <div class="two"><button class="btn alt" onclick="copyReport()">Скопировать ещё раз</button><button class="btn alt" onclick="report=null;render()">Закрыть</button></div></div>`;
  if (D.ws.length) { const all = D.ws.slice().reverse(), lim = wAll || all.length <= 20 ? all.length : 20;
    h += `<h2>Сессии</h2>` + all.slice(0, lim).map(w => shiftCard(w, true)).join('') + (lim < all.length ? `<button class="btn alt" onclick="wAll=1;render()">Показать все сессии (${all.length})</button>` : ''); }
  if (!D.rows.length && !D.ws.length) h += '<div class="card hint center">За этот период работы не было</div>';
  h += `<div class="hint" style="margin-top:12px">Заработано = часы в задачах × ставка проекта. У незакрытых проектов ставка предварительная — снижается, пока добавляются часы.</div>`;
  return h + '</div>';
}
setInterval(() => {
  if (!S) return;
  const dur = sessWork(), work = sum(shiftEs(S.w.id));
  const p = $('#wpct'); if (p) p.textContent = pct(work, dur) + '%';
}, 1000);

// ---- выпадающие подсказки для тегов: касание / мышь / стрелки ↓↑ + Enter, Esc — закрыть
let acBox = null, acIdx = -1, acInp = null;
function acClose() { if (acBox) acBox.remove(); acBox = null; acIdx = -1; acInp = null; }
function acOpen(inp) {
  const q = inp.value.trim().toLowerCase();
  const list = catValues(inp.dataset.ac).filter(v => v.toLowerCase() !== q && (!q || v.toLowerCase().includes(q))).slice(0, 8);
  acClose(); if (!list.length) return;
  acInp = inp; acBox = document.createElement('div'); acBox.className = 'acbox'; acBox._vals = list;
  acBox.innerHTML = list.map((v, i) => { const k = q ? v.toLowerCase().indexOf(q) : -1; return `<div class="aci" data-i="${i}">${k < 0 ? esc(v) : esc(v.slice(0, k)) + '<b>' + esc(v.slice(k, k + q.length)) + '</b>' + esc(v.slice(k + q.length))}</div>`; }).join('');
  // pointerdown/mousedown — не отдаём фокус полю; выбор — по click, чтобы касание не «провалилось» на кнопку под списком
  ['pointerdown', 'mousedown'].forEach(ev => acBox.addEventListener(ev, e => e.preventDefault()));
  acBox.addEventListener('click', e => { const it = e.target.closest('.aci'); if (!it) return; e.preventDefault(); e.stopPropagation(); acPick(+it.dataset.i); });
  document.body.appendChild(acBox); acPlace();
}
function acPlace() {
  if (!acBox || !acInp) return;
  const r = (acInp.closest('.tf') || acInp).getBoundingClientRect(), vh = (window.visualViewport && visualViewport.height) || innerHeight;
  const below = vh - r.bottom, h = Math.min(acBox.scrollHeight, 220);
  Object.assign(acBox.style, { left: r.left + 'px', width: r.width + 'px', top: (below >= h + 8 || below > r.top ? r.bottom + 4 : r.top - h - 4) + 'px' });
}
function acPick(i) { const inp = acInp, v = acBox && acBox._vals[i]; if (!inp || v == null) return; inp.value = v; acClose(); inp.dispatchEvent(new Event('change', { bubbles: true })); }
function acHi(i) { const items = acBox.querySelectorAll('.aci'); acIdx = (i + items.length) % items.length; items.forEach((x, j) => x.classList.toggle('on', j === acIdx)); items[acIdx].scrollIntoView({ block: 'nearest' }); }
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('input[data-ac]')) acOpen(e.target); });
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input[data-ac]')) acOpen(e.target); });
document.addEventListener('focusout', e => { if (e.target === acInp) setTimeout(() => { if (document.activeElement !== acInp) acClose(); }, 150); });
document.addEventListener('keydown', e => {
  if (!acBox || e.target !== acInp) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); acHi(acIdx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acHi(acIdx - 1); }
  else if (e.key === 'Enter' && acIdx >= 0) { e.preventDefault(); e.stopPropagation(); acPick(acIdx); }
  else if (e.key === 'Escape') acClose();
}, true);
window.addEventListener('resize', acPlace); if (window.visualViewport) visualViewport.addEventListener('resize', acPlace);
document.addEventListener('scroll', e => { if (e.target !== acBox) acPlace(); }, true);
function render() {
  acClose();
  ['home', 'todo', 'proj', 'stat'].forEach(t => $('#n-' + t).classList.toggle('on', t === tab));
  const p = cur && proj(cur);
  $('#app').innerHTML = settings ? viewSettings() : gearBtn() + (tab === 'home' ? viewHome() : tab === 'todo' ? viewTodo() : tab === 'stat' ? viewStats() : p ? viewProject(p) : viewProjects());
  const key = settings ? 'settings' : tab + (p ? p.id : ''); if (key !== render.k) { $('#app').scrollTop = 0; render.k = key; }
  if (V('6.1')) { if (p || settings) tg.BackButton.show(); else tg.BackButton.hide(); }
  const pg = $('#pager'); if (pg) { fitPager(); document.querySelectorAll('#app details').forEach(d => d.addEventListener('toggle', fitPager)); }
  const on = $('.ftab.on'), bar = $('.ftabs'); if (on && bar) bar.scrollLeft = on.offsetLeft - bar.clientWidth / 2 + on.clientWidth / 2;
  const ri = $('#ren'); if (ri) { ri.focus(); ri.select(); }
}
if (V('6.1')) tg.BackButton.onClick(() => { if (settings) settings = false; else { cur = null; ren = null; } render(); });

setInterval(() => {
  if (!S) return;
  const w = $('#wclock'); if (w) w.textContent = fd(sessWork());
  const bc = $('#bclock'); if (bc && S.br) bc.textContent = fd(now() - S.br);
  const wb = $('#wbrk'); if (wb) { const bs = sessBreaks(); wb.textContent = bs ? fh(bs) : ''; }
  const k = $('#wwork'); if (k) k.textContent = fh(sum(shiftEs(S.w.id)));
  const t = $('#tclock'); if (t && S.t) t.textContent = fd(taskSec(S.t));
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !ren && !document.activeElement.matches('input,textarea')) render(); });

// запрет масштабирования: щипок (iOS), Ctrl+колесо (двойной тап отключён через touch-action в CSS) / Ctrl+± на компьютере
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });
function showErr(m) {
  const d = document.createElement('div'); d.className = 'errbar'; d.textContent = 'Ошибка: ' + m;
  d.onclick = () => d.remove(); document.body.appendChild(d); setTimeout(() => d.remove(), 8000);
}
window.addEventListener('error', e => showErr(e.message || 'неизвестная'));
window.addEventListener('unhandledrejection', e => showErr((e.reason && e.reason.message) || String(e.reason)));
initSwipe();
load().then(async () => { if (opt.full !== false) setFull(true); try { if (mobile && V('8.0')) tg.lockOrientation(); } catch {} render(); autoBackup(); }).catch(e => { $('#app').innerHTML = '<div class="card">Не удалось загрузить данные: ' + esc((e && e.message) || e) + '</div>'; });
</script>
</body>
</html>
